{% extends 'base.html' %}{% block content %}<div class="page-head"><div><p class="eyebrow">Stay on top of things</p><h1>Notifications</h1></div></div><div class="card">{% for n in notifications %}<div class="notification {% if not n.read %}unread{% endif %}"><span class="notification-icon">{% if n.kind=='warning' %}⚠{% else %}●{% endif %}</span><div><strong>{{n.title}}</strong><p>{{n.message}}</p><small title="{{n.created_at.strftime('%d %b %Y, %I:%M %p')}}">{{n.created_at|relative_time}}</small></div></div>{% else %}<div class="empty">You’re all caught up.</div>{% endfor %}</div>{% endblock %}
